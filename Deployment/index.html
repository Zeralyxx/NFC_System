<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Terminal | PIN Reset</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg-base: #0A0A0A;
            --bg-card: #141414;
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --error: #F87171;
            --success: #34D399;
            --border-light: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at top right, #1a233a 0%, transparent 40%), radial-gradient(circle at bottom left, #120a1f 0%, transparent 40%);
        }

        .container {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 400px; 
            margin: 20px;
            box-shadow: 0 24px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

            .input-group label {
                display: block;
                font-size: 12px;
                margin-bottom: 8px;
                font-weight: 600;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .input-group input {
                width: 100%;
                padding: 14px 16px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid var(--border-light);
                border-radius: 8px;
                color: white;
                font-size: 16px;
                box-sizing: border-box;
                transition: all 0.2s ease-in-out;
            }

                .input-group input:focus {
                    outline: none;
                    border-color: var(--accent);
                    background: rgba(255, 255, 255, 0.06);
                    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
                }

        /* Specialized input for OTP and PINs */
        .security-input {
            text-align: center;
            letter-spacing: 12px;
            font-size: 24px !important;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

            .security-input::placeholder {
                letter-spacing: normal;
                font-size: 16px;
                font-weight: normal;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            button:hover:not(:disabled) {
                background-color: var(--accent-hover);
            }

            button:active:not(:disabled) {
                transform: scale(0.98);
            }

            button:disabled {
                background-color: #333;
                color: #888;
                cursor: not-allowed;
            }

        .text-btn {
            background: none;
            color: var(--text-muted);
            padding: 8px;
            font-size: 13px;
            margin-top: 12px;
            font-weight: 500;
        }

            .text-btn:hover:not(:disabled) {
                background: none;
                color: var(--text-main);
                text-decoration: underline;
            }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

            .status.error {
                background: rgba(248, 113, 113, 0.1);
                color: var(--error);
                border: 1px solid rgba(248, 113, 113, 0.2);
                display: block;
            }

            .status.success {
                background: rgba(52, 211, 153, 0.1);
                color: var(--success);
                border: 1px solid rgba(52, 211, 153, 0.2);
                display: block;
            }

        /* --- ANIMATIONS --- */
        .stage {
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hidden {
            display: none !important;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* CSS Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 10px;
            display: none;
        }

        button:disabled .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h2 { font-size: 20px; }
            .security-input { letter-spacing: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gate Terminal PIN Reset</h2>

        <!-- STAGE 1: Request OTP -->
        <div id="stage-1" class="stage">
            <p>Verify your identity. A 6-digit code will be sent to your institutional email.</p>
            
            <div class="input-group">
                <label>Student ID</label>
                <input type="text" id="studentId" placeholder="e.g. 26-00001" autocomplete="off">
            </div>

            <!-- IDEA 1: Secondary Information Requirement -->
            <div class="input-group">
                <label>Institutional Email</label>
                <input type="email" id="studentEmail" placeholder="student@university.edu" autocomplete="off">
            </div>

            <button id="btnRequestOtp">
                <span class="spinner"></span>
                <span class="btn-text">Send Verification Code</span>
            </button>
        </div>

        <!-- STAGE 2: Verify OTP -->
        <div id="stage-2" class="stage hidden">
            <p>We sent a 6-digit code to your email. Please enter it below.</p>
            <div class="input-group">
                <label>Verification Code</label>
                <input type="text" id="otpCode" class="security-input" placeholder="000000" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <button id="btnVerifyOtp">
                <span class="spinner"></span>
                <span class="btn-text">Verify Code</span>
            </button>
            <button id="btnResendOtp" class="text-btn">Resend Code</button>
        </div>

        <!-- STAGE 3: New PIN -->
        <div id="stage-3" class="stage hidden">
            <p>Verification successful. Create your new 4-digit PIN.</p>
            <div class="input-group">
                <label>New 4-Digit PIN</label>
                <input type="password" id="newPin" class="security-input" placeholder="****" maxlength="4" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="input-group">
                <label>Confirm PIN</label>
                <input type="password" id="confirmPin" class="security-input" placeholder="****" maxlength="4" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <button id="btnResetPin">
                <span class="spinner"></span>
                <span class="btn-text">Set New PIN</span>
            </button>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="status"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCRz3BVZaLO7lA5nlKDlj187su5piFhdRo",
            authDomain: "nfc-system-d6ec2.firebaseapp.com",
            projectId: "nfc-system-d6ec2",
            storageBucket: "nfc-system-d6ec2.firebasestorage.app",
            messagingSenderId: "767021424378",
            appId: "1:767021424378:web:75f7c6fa79e14c0ac1b343"
        };

        const EMAILJS_PUBLIC_KEY = "rHCQQuC4OTsz-96MZ";
        const EMAILJS_SERVICE_ID = "nfc_team";
        const EMAILJS_TEMPLATE_ID = "template_zcaqxc7";
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        emailjs.init(EMAILJS_PUBLIC_KEY);

        let currentStudentId = "";
        let currentStudentName = "";
        let currentStudentEmail = "";
        let generatedOtp = "";

        const stage1 = document.getElementById('stage-1');
        const stage2 = document.getElementById('stage-2');
        const stage3 = document.getElementById('stage-3');
        const statusMsg = document.getElementById('statusMessage');

        function showMessage(msg, isError = true) {
            statusMsg.textContent = msg;
            statusMsg.className = isError ? "status error" : "status success";
        }

        function setButtonState(btnId, isLoading, loadingText, originalText) {
            const btn = document.getElementById(btnId);
            const textSpan = btn.querySelector('.btn-text');
            btn.disabled = isLoading;
            textSpan.textContent = isLoading ? loadingText : originalText;
        }

        function generateSecureOtp() {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return (array[0] % 900000 + 100000).toString();
        }

        async function triggerOtpEmail() {
            generatedOtp = generateSecureOtp();
            await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                student_name: currentStudentName,
                otp_code: generatedOtp,
                to_email: currentStudentEmail
            });
        }

        // --- STAGE 1: Request OTP ---
        document.getElementById('btnRequestOtp').addEventListener('click', async () => {
            
            const studentId = document.getElementById('studentId').value.trim();
            const emailInput = document.getElementById('studentEmail').value.trim().toLowerCase();
            
            if (!studentId || !emailInput) {
                return showMessage("Please enter both your Student ID and Email.");
            }

            setButtonState('btnRequestOtp', true, "Verifying...", "Send Verification Code");
            statusMsg.className = "hidden";

            try {
                const encodedId = encodeURIComponent(studentId);
                const docRef = doc(db, "students", encodedId);
                const docSnap = await getDoc(docRef);

                // IDEA 3: The Generic Rejection Phrase (Prevents data harvesting)
                const genericRejectionMsg = "Invalid Student ID or Email combination.";

                if (!docSnap.exists()) {
                    setButtonState('btnRequestOtp', false, "", "Send Verification Code");
                    return showMessage(genericRejectionMsg);
                }

                const data = docSnap.data();
                const dbEmail = data.email ? data.email.toLowerCase() : "";

                // IDEA 1: Second Piece of Info validation
                if (dbEmail !== emailInput) {
                    setButtonState('btnRequestOtp', false, "", "Send Verification Code");
                    return showMessage(genericRejectionMsg);
                }

                currentStudentEmail = data.email;
                currentStudentName = data.full_name;

                // IDEA 2: Database-level Cooldown Check (3 minutes)
                const now = Date.now();
                const lastReq = data.last_otp_request || 0;
                const cooldownMs = 60 * 1000; 

                if (now - lastReq < cooldownMs) {
                    const remainingMins = Math.ceil((cooldownMs - (now - lastReq)) / 60000);
                    setButtonState('btnRequestOtp', false, "", "Send Verification Code");
                    return showMessage(`An OTP was recently requested. Please check your email or wait ${remainingMins} minute(s).`);
                }

                // If we pass all security checks: Update DB timer and Send Email
                await updateDoc(docRef, {
                    last_otp_request: now
                });
                
                await triggerOtpEmail();

                currentStudentId = encodedId;
                stage1.classList.add('hidden');
                stage2.classList.remove('hidden');

                setTimeout(() => document.getElementById('otpCode').focus(), 100);
                showMessage("Code sent successfully!", false);

            } catch (error) {
                console.error(error);
                showMessage("Failed to connect or send email. Try again later.");
                setButtonState('btnRequestOtp', false, "", "Send Verification Code");
            }
        });

        // --- Resend OTP Logic ---
        document.getElementById('btnResendOtp').addEventListener('click', async () => {
            const resendBtn = document.getElementById('btnResendOtp');
            resendBtn.disabled = true;
            resendBtn.textContent = "Sending...";

            try {
                // THE FIX: Actually check the database again so hackers can't bypass the UI timer!
                const docRef = doc(db, "students", currentStudentId);
                const docSnap = await getDoc(docRef);
                const lastReq = docSnap.data().last_otp_request || 0;
                const now = Date.now();
                const cooldownMs = 60 * 1000; // 60 Seconds

                if (now - lastReq < cooldownMs) {
                    const remainingSecs = Math.ceil((cooldownMs - (now - lastReq)) / 1000);
                    showMessage(`Please wait ${remainingSecs} more seconds before resending.`);
                    resendBtn.textContent = "Resend Code";
                    resendBtn.disabled = false;
                    return;
                }

                // If 60 seconds have passed, update DB and send!
                await updateDoc(docRef, { last_otp_request: now });
                await triggerOtpEmail();
                
                showMessage("A new code was sent to your email.", false);

                let uiCooldown = 60; 
                const timer = setInterval(() => {
                    resendBtn.textContent = `Resend available in ${uiCooldown}s`;
                    uiCooldown--;
                    if (uiCooldown < 0) {
                        clearInterval(timer);
                        resendBtn.textContent = "Resend Code";
                        resendBtn.disabled = false;
                    }
                }, 1000);
            } catch {
                showMessage("Failed to resend code.");
                resendBtn.disabled = false;
                resendBtn.textContent = "Resend Code";
            }
        });

        // --- STAGE 2: Verify OTP ---
        document.getElementById('btnVerifyOtp').addEventListener('click', () => {
            const enteredOtp = document.getElementById('otpCode').value.trim();
            if (enteredOtp === generatedOtp) {
                stage2.classList.add('hidden');
                stage3.classList.remove('hidden');

                setTimeout(() => document.getElementById('newPin').focus(), 100);
                showMessage("Code verified. Create a new PIN.", false);
            } else {
                showMessage("Incorrect verification code.");
            }
        });

        // --- STAGE 3: Hash PIN and Update Firestore ---
        document.getElementById('btnResetPin').addEventListener('click', async () => {
            const newPin = document.getElementById('newPin').value;
            const confirmPin = document.getElementById('confirmPin').value;

            if (newPin.length !== 4 || isNaN(newPin)) return showMessage("PIN must be exactly 4 digits.");
            if (newPin !== confirmPin) return showMessage("PINs do not match.");

            setButtonState('btnResetPin', true, "Updating Database...", "Set New PIN");

            try {
                const saltArray = window.crypto.getRandomValues(new Uint8Array(16));
                const enc = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey(
                    "raw", enc.encode(newPin), { name: "PBKDF2" }, false, ["deriveBits", "deriveKey"]
                );

                const hashBuffer = await window.crypto.subtle.deriveBits(
                    { name: "PBKDF2", salt: saltArray, iterations: 100000, hash: "SHA-256" },
                    keyMaterial, 256
                );

                const base64Salt = btoa(String.fromCharCode(...saltArray));
                const base64Hash = btoa(String.fromCharCode(...new Uint8Array(hashBuffer)));

                const docRef = doc(db, "students", currentStudentId);
                await updateDoc(docRef, {
                    pin_hash: base64Hash,
                    pin_salt: base64Salt,
                    pin_locked: false,
                    failed_pin_attempts: 0
                });

                showMessage("PIN reset successfully! You need to wait for 1 day (or until the next Admin Sync) before changes are applied.", false);

                const btn = document.getElementById('btnResetPin');
                btn.innerHTML = "Reset Complete";

                document.getElementById('newPin').value = "";
                document.getElementById('confirmPin').value = "";

            } catch (error) {
                console.error(error);
                showMessage("Failed to update PIN. Please try again.");
                setButtonState('btnResetPin', false, "", "Set New PIN");
            }
        });

        // Enter Key triggers
        document.getElementById('studentId').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('studentEmail').focus();
        });
        document.getElementById('studentEmail').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('btnRequestOtp').click();
        });
        document.getElementById('otpCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('btnVerifyOtp').click();
        });
        document.getElementById('confirmPin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('btnResetPin').click();
        });
    </script>
</body>
</html>
